spring:
  application:
    name: ged-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/ged}
    username: ${DATABASE_USER:ged}
    password: ${DATABASE_PASSWORD:ged}
  jpa:
    open-in-view: false
    hibernate:
      # Le schéma appartient à Flyway (src/main/resources/db/migration)
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB
  mvc:
    problemdetails:
      enabled: true

logging:
  level:
    # PDFBox signale chaque police remplacée à la lecture d'un PDF : sans intérêt ici
    org.apache.pdfbox: ERROR

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # « prêt » seulement si la base et le stockage des fichiers répondent
        readiness:
          include: readinessState,db,storage

ged:
  jwt:
    # 32 caractères minimum. En production : variable d'environnement JWT_SECRET
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  cookie:
    # true derrière HTTPS ; false pour un déploiement local en HTTP
    secure: ${COOKIE_SECURE:false}
  storage:
    # local : dossier sur disque ; s3 : MinIO (ou tout service compatible S3)
    type: ${STORAGE_TYPE:local}
    dir: ${STORAGE_DIR:./storage}
    # En s3 : ancien dossier local dont les fichiers manquants sont copiés dans le bucket au démarrage
    import-dir: ${STORAGE_IMPORT_DIR:}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:ged-documents}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:true}
      console-url: ${S3_CONSOLE_URL:}
      # Compte distinct pour les destructions (bordereaux d'élimination visés) ; vide = compte principal
      disposal-access-key: ${S3_DISPOSAL_ACCESS_KEY:}
      disposal-secret-key: ${S3_DISPOSAL_SECRET_KEY:}
  demo-data:
    enabled: ${DEMO_DATA:true}
  ocr:
    # Lecture du texte des fichiers : texte des PDF, reconnaissance (Tesseract) des scans et des images
    enabled: ${OCR_ENABLED:true}
    tesseract: ${OCR_TESSERACT:tesseract}
    dpi: ${OCR_DPI:300}
    max-pages: ${OCR_MAX_PAGES:500}
    page-timeout: ${OCR_PAGE_TIMEOUT:3m}
    low-confidence: ${OCR_LOW_CONFIDENCE:65}
